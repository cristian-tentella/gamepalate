name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Skip optimizations
        run: >
          Set-Content $env:RUNNER_TEMP/ci.toml
          '[profile.dev.package."*"]', 'opt-level = 0',
          '[profile.dev.package.gamepalate-core]', 'opt-level = 0'
      - run: cargo clippy --config $env:RUNNER_TEMP/ci.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo test --config $env:RUNNER_TEMP/ci.toml --workspace --locked
