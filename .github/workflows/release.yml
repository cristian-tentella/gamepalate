name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the version
        run: |
          $version = (cargo pkgid -p gamepalate-gui) -split '[#@]' | Select-Object -Last 1
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match version $version" }
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p gamepalate-gui -p gamepalate-cli
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/gamepalate.exe, target/release/gamepalate-cli.exe dist/
          Get-ChildItem dist -File |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG (Get-ChildItem dist -File).FullName --draft --generate-notes --title "gamepalate $env:TAG"
