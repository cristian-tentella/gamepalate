name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
      - name: Check the tag matches the version
        run: |
          $version = (cargo pkgid -p gamepalate-gui) -split '[#@]' | Select-Object -Last 1
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match version $version" }
      - run: cargo build --release --locked -p gamepalate-gui -p gamepalate-cli
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/gamepalate.exe, target/release/gamepalate-cli.exe dist/
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/O$PWD\dist" crates/gamepalate-gui/gamepalate.iss
          if ($LASTEXITCODE) { throw "ISCC failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Check the tag matches the version
        run: |
          version=$(cargo pkgid -p gamepalate-gui | sed 's/.*[#@]//')
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match version $version"; exit 1; }
      - run: cargo build --release --locked -p gamepalate-gui -p gamepalate-cli
      - name: Package
        run: |
          mkdir -p dist/gamepalate
          cp target/release/gamepalate target/release/gamepalate-cli dist/gamepalate/
          cp crates/gamepalate-gui/gamepalate.desktop crates/gamepalate-gui/gamepalate.png LICENSE-MIT LICENSE-APACHE dist/gamepalate/
          tar -C dist -czf dist/gamepalate-x86_64-linux.tar.gz gamepalate
          rm -r dist/gamepalate
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [release, linux]
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Draft the release
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "gamepalate $TAG"
