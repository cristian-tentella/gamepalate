[package]
name = "gamepalate-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
gamepalate-app = { version = "0.1.0", path = "../gamepalate-app" }
gamepalate-core = { version = "0.1.0", path = "../gamepalate-core" }
gamepalate-store = { version = "0.1.0", path = "../gamepalate-store" }
gamepalate-steam = { version = "0.1.0", path = "../gamepalate-steam" }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
anyhow = "1.0.104"
jiff = "0.2.38"
comfy-table = "8.0.1"
open = "5.4.5"
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3.34"
env_logger = "0.11.11"

[[bin]]
name = "gamepalate"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
