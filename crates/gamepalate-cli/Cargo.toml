[package]
name = "gamepalate-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
gamepalate-core = { version = "0.1.0", path = "../gamepalate-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
