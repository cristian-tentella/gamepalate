[package]
name = "gamepalate-app"
version = "0.34.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
jiff = "0.2.38"
gamepalate-core = { version = "0.34.0", path = "../gamepalate-core" }
gamepalate-steam = { version = "0.34.0", path = "../gamepalate-steam" }
gamepalate-store = { version = "0.34.0", path = "../gamepalate-store" }
dirs = "7.0.0"
sys-locale = "0.3.2"
futures = "0.3.34"
reqwest = "0.13.5"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
keyring-core = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1", features = ["sync", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "tracing-log"] }
tracing = "0.1.44"
avif-parse = "2.1.0"
dav1d = { package = "re_rav1d", version = "0.1.3" }
yuv = "0.8.20"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
http = "1.5.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
