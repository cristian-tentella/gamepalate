[package]
name = "gamepalate-app"
version = "0.17.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
jiff = "0.2.38"
gamepalate-core = { version = "0.17.1", path = "../gamepalate-core" }
gamepalate-steam = { version = "0.17.1", path = "../gamepalate-steam" }
gamepalate-store = { version = "0.17.1", path = "../gamepalate-store" }
dirs = "7.0.0"
futures = "0.3.34"
reqwest = "0.13.5"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
keyring-core = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1", features = ["sync", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing = "0.1.44"
avif-decode = { version = "3.0.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
http = "1.5.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
