[package]
name = "gamepalate-steam"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
gamepalate-core = { version = "0.1.0", path = "../gamepalate-core" }
log = "0.4.34"
reqwest = { version = "0.13.5", features = ["json", "gzip", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
http = "1.5.0"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
