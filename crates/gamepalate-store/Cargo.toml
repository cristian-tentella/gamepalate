[package]
name = "gamepalate-store"
version = "0.1.0"
edition = "2024"

[dependencies]
gamepalate-core = { version = "0.1.0", path = "../gamepalate-core", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3.27.0"
