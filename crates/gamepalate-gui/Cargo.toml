[package]
name = "gamepalate-gui"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gamepalate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
gamepalate-app = { version = "0.2.0", path = "../gamepalate-app" }
iced = { version = "0.14.0", features = ["advanced", "image", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jiff = "0.2.38"
tokio = { version = "1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-winres = "0.3.7"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
