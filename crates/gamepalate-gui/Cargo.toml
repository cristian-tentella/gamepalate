[package]
name = "gamepalate-gui"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
gamepalate-app = { version = "0.2.0", path = "../gamepalate-app" }
iced = { version = "0.14.0", features = ["advanced", "image", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jiff = "0.2.38"
tokio = { version = "1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
